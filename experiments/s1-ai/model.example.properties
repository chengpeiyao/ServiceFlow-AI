# 复制到项目 config_al/model.local.properties 后填写；文件内容使用 UTF-8。
# endpoint 必须是完整的 HTTPS Chat Completions 地址，不能带密钥或查询参数。
endpoint=https://api.example.com/v1/chat/completions
model=填写服务商支持的模型标识
# 密钥只从环境变量读取，不要写入本文件。
keyEnvironment=SERVICEFLOW_AI_API_KEY
# 按服务商文档选择 max_completion_tokens 或 max_tokens，不自动切换。
tokenParameter=max_completion_tokens
# 按服务商支持情况选择 json_schema 或 json_object，两组必须保持相同。
responseFormat=json_schema
# 空值表示不发送 temperature，适用于不支持该参数的模型。
temperature=
# 可选：用户确认价格后同时填写以下五项；否则费用保持 NULL。
# pricing.inputPerMillion=0
# pricing.outputPerMillion=0
# pricing.currency=CNY
# pricing.source=https://服务商官方价格页面
# pricing.checkedOn=2026-10-19
